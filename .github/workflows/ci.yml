name: Breast Cancer CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/**"
      - "api/**"
      - "tests/**"
      - "requirements-api.txt"
      - "data/raw/data.csv"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "config.yaml"
      - "src/**"
      - "api/**"
      - "tests/**"
      - "requirements-api.txt"
      - "data/raw/data.csv"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt pytest

      - name: Train and evaluate
        run: python src/breast_cancer_pipeline.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t breast-cancer-api:ci .
