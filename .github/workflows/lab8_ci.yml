name: Lab 8 - Breast Cancer MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/**"
      - "requirements-api.txt"
      - "data/raw/data.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/**"
      - "requirements-api.txt"
      - "data/raw/data.csv"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  mlops-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run breast-cancer MLOps pipeline
        run: python src/mlops_pipeline/breast_cancer_prediction_pipeline.py

      - name: Run API and pipeline tests
        run: python -m pytest -q

      - name: Upload Lab 8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab8-evidence-${{ github.run_number }}
          path: |
            reports/**
            logs/**
            outputs/**
            artifacts/**
          if-no-files-found: ignore
