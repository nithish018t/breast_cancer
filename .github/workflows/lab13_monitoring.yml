name: Lab 13 - End-to-End MLOps
# Integration test: process a genuinely new incoming batch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Kolkata"

jobs:
  mlops-monitoring:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Run MLOps monitoring trigger
        shell: powershell
        run: |
          $projectPath = "C:\Users\tnaga\OneDrive\Desktop\churn-prediction-full-project-files\churn-prediction"
          $pythonPath = "C:\Users\tnaga\OneDrive\Desktop\churn-prediction-full-project-files\.venv\Scripts\python.exe"
          Set-Location $projectPath
          & $pythonPath ".\src\mlops_pipeline\12_monitor_trigger.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show monitoring result
        shell: powershell
        run: |
          $projectPath = "C:\Users\tnaga\OneDrive\Desktop\churn-prediction-full-project-files\churn-prediction"
          Set-Location $projectPath
          if (Test-Path ".\outputs\monitoring\monitor_trigger_report.json") {
              Get-Content ".\outputs\monitoring\monitor_trigger_report.json"
          } else {
              Write-Error "Monitoring report was not generated."
              exit 1
          }

      - name: Verify Kubernetes
        shell: powershell
        run: |
          kubectl get deployment churn-api
          kubectl get pods