name: Lab 13 - Self Hosted Runner Test

on:
  push:
    branches:
      - lab13-integration
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Python
        shell: powershell
        run: |
          $pythonPath = "C:\Users\tnaga\OneDrive\Desktop\churn-prediction-full-project-files\.venv\Scripts\python.exe"
          if (-not (Test-Path $pythonPath)) { throw "Project Python not found: $pythonPath" }
          & $pythonPath --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Git
        shell: powershell
        run: git --version

      - name: Check Docker
        shell: powershell
        run: docker info

      - name: Check Kubernetes
        shell: powershell
        run: kubectl get nodes

      - name: Check Project
        shell: powershell
        run: |
          $projectPath = "C:\Users\tnaga\OneDrive\Desktop\churn-prediction-full-project-files\churn-prediction"
          if (-not (Test-Path $projectPath)) { throw "Project folder not found: $projectPath" }
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Project: $projectPath"
          if (-not (Test-Path (Join-Path $projectPath "src\mlops_pipeline\12_monitor_trigger.py"))) {
              throw "Lab 13 monitoring script is missing from $projectPath"
          }
